<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ระบบลงงานทีมงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--g:#04803A;--g2:#E8F5EC;--gb:#A9D9B8;--ink:#1A1D1A;--mut:#454B45;--mut2:#5B625B;--bg:#F6F7F5;--line:#DDE2DC;--in:#C9CFC8;--warn:#B45309;--warnbg:#FDF1E4;--warnink:#7A3A06;--bad:#B42318}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  header.admin{background:var(--ink);color:#fff;border-bottom:0}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .who{font-size:13px;opacity:.85}
  main{padding:16px 16px 96px;max-width:560px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut2);text-decoration:none}
  nav a.on{color:var(--g);font-weight:700}
  nav svg{width:22px;height:22px}
  h2{font-size:15px;color:var(--mut);margin:18px 0 8px}
  h2:first-child{margin-top:0}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .card.active{border:2px solid var(--g)}
  .card.warn{border:2px solid var(--warn)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .title{font-size:17px;font-weight:700;line-height:1.35;margin:6px 0 2px}
  .sub{font-size:14px;color:var(--mut)}
  .small{font-size:13px;color:var(--mut2)}
  .chip{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:#ECEFEB;color:var(--mut)}
  .chip.g{background:var(--g);color:#fff}
  .chip.lg{background:var(--g2);color:#1F5132}
  .chip.w{background:var(--warnbg);color:var(--warnink)}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:12px;font:inherit;font-size:16px;font-weight:700;background:var(--g);color:#fff;margin-top:10px;cursor:pointer;text-decoration:none}
  .btn.dark{background:var(--ink)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--in);font-weight:600}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid #E7B4AE;font-weight:600}
  .btn:disabled{background:#9AA39A;color:#fff;border:0}
  .btn.sm{min-height:40px;font-size:14px;width:auto;padding:0 14px;margin-top:0}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;margin-bottom:12px}
  input,select,textarea{font:inherit;font-size:16px;font-weight:400;border:1px solid var(--in);border-radius:10px;padding:0 12px;height:46px;background:#fff;color:var(--ink);width:100%;min-width:0}
  textarea{height:auto;padding:10px 12px;resize:vertical}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--in);background:#fff;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  .pill.on{border:2px solid var(--g);background:var(--g2);color:#1F5132;font-weight:700}
  .photo{width:100%;min-height:120px;border:1px dashed #9AA39A;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:14px;cursor:pointer;overflow:hidden;position:relative}
  .photo img{width:100%;max-height:260px;object-fit:cover;display:block}
  .photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .status{display:flex;gap:10px;align-items:center;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
  .status.ok{background:var(--g2);border:1px solid var(--gb);color:#1F5132}
  .status.w{background:var(--warnbg);border:1px solid #F0C99B;color:var(--warnink)}
  .status.n{background:#ECEFEB;color:var(--mut)}
  .status b{display:block;font-size:15px}
  #map{height:220px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl td,.tbl th{padding:8px 4px;border-top:1px solid #E3E7E2;text-align:left;vertical-align:top}
  .tbl th{font-size:13px;color:var(--mut)}
  .tbl .r{text-align:right;white-space:nowrap}
  .sum{display:flex;justify-content:space-between;font-size:15px;padding:4px 0}
  .sum.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
  .empty{text-align:center;color:var(--mut2);padding:40px 10px;font-size:15px}
  .loading{text-align:center;color:var(--mut2);padding:60px 10px}
  .err{background:#FDECEA;border:1px solid #F3B8B2;color:#7A1C14;border-radius:12px;padding:14px;font-size:15px}
  #toast{position:fixed;left:16px;right:16px;bottom:80px;z-index:50;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;display:none;text-align:center}
  #toast.bad{background:var(--bad)}
  #busy{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:15px;color:var(--ink)}
  .spin{width:36px;height:36px;border:4px solid #CFD6CE;border-top-color:var(--g);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  #modal .box{background:#fff;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px}
  #modal h3{margin:0 0 8px;font-size:18px}
  #modal p{margin:0 0 6px;color:var(--mut);font-size:15px;line-height:1.55;white-space:pre-line}
  .datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .datebar input{flex:1}
  .iconbtn{width:46px;height:46px;flex-shrink:0;border:1px solid var(--in);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .member{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid #EEF0ED}
  .member:first-of-type{border-top:0}
  a.link{color:var(--g);font-weight:600}
  .imgview{width:100%;border-radius:10px;margin-top:8px}
  .hr{height:1px;background:var(--line);margin:12px 0}
</style>
</head>
<body>
<header id="hdr"><h1>ระบบลงงานทีมงาน</h1><span class="who" id="who"></span></header>
<main id="app"><div class="loading">กำลังโหลด…</div></main>
<nav id="nav" style="display:none"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy"><div class="spin"></div><div id="busyText">กำลังบันทึก…</div></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><h3 id="mTitle"></h3><p id="mText"></p><button class="btn" id="mOk">ตกลง</button><button class="btn ghost" id="mCancel">ยกเลิก</button></div></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= ตั้งค่า: แก้ 2 บรรทัดนี้ ================= */
const CONFIG = {
  LIFF_ID: '2012447780-l9ZdlBm3',
  API_URL: 'https://script.google.com/macros/s/AKfycbzegGO1Ku9ftA4cr8GnzBsnpksL-UylJpQG5n5jBWw5Eho2U9Kx9oevaz1XptOb4Nch1w/exec'
};
/* ======================================================== */

const $ = (id) => document.getElementById(id);
const app = $('app');
const S = { me: null, admin: null, jobs: [], groups: {}, adminFrom: null };

const ICON = {
  jobs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  left: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  cam: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

/* ---------------- utils ---------------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function int(n) { return Number(n || 0).toLocaleString('en-US'); }
function pad(n) { return String(n).padStart(2, '0'); }
function ymdLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(ymd, n) { const [y, m, d] = ymd.split('-').map(Number); const x = new Date(y, m - 1, d + n); return ymdLocal(x); }
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
function thDate(ymd) { const [y, m, d] = ymd.split('-').map(Number); const x = new Date(y, m - 1, d); return TH_D[x.getDay()] + ' ' + d + ' ' + TH_M[m - 1] + ' ' + (y + 543); }
function dist(a1, o1, a2, o2) { const R = 6371000, t = (x) => x * Math.PI / 180; const h = Math.sin(t(a2 - a1) / 2) ** 2 + Math.cos(t(a1)) * Math.cos(t(a2)) * Math.sin(t(o2 - o1) / 2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(h))); }
function fmtDist(m) { m = Number(m); return m >= 1000 ? (Math.round(m / 100) / 10) + ' กม.' : m + ' ม.'; }

let toastTimer;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, bad ? 5000 : 2600);
}
function busy(on, text) { $('busyText').textContent = text || 'กำลังบันทึก…'; $('busy').style.display = on ? 'flex' : 'none'; }
function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    $('mTitle').textContent = title; $('mText').textContent = text || '';
    const ok = $('mOk'); ok.textContent = okLabel || 'ตกลง'; ok.className = danger ? 'btn danger' : 'btn';
    $('modal').style.display = 'flex';
    const done = (v) => { $('modal').style.display = 'none'; ok.onclick = null; $('mCancel').onclick = null; resolve(v); };
    ok.onclick = () => done(true); $('mCancel').onclick = () => done(false);
  });
}
function openExternal(url) {
  try { if (liff.isInClient()) { liff.openWindow({ url, external: true }); return; } } catch (e) { /* ignore */ }
  window.open(url, '_blank');
}

let reloginTried = false;
async function api(action, payload) {
  const idToken = liff.getIDToken();
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload: payload || {}, idToken })
  });
  const j = await res.json();
  if (!j.ok) {
    if (/ยืนยันตัวตน|เปิดผ่าน LINE/.test(j.error) && !reloginTried) {
      reloginTried = true;
      liff.logout(); liff.login({ redirectUri: location.href });
    }
    throw new Error(j.error);
  }
  return j.data;
}

function fileToJpeg(file, max, q) {
  max = max || 900; q = q || 0.75;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => reject(new Error('อ่านรูปไม่ได้ ลองถ่ายใหม่'));
    img.src = url;
  });
}

function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('มือถือไม่รองรับ GPS'));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      (e) => reject(new Error(e.code === 1 ? 'กรุณาอนุญาตให้ LINE เข้าถึงตำแหน่ง (Location) ในการตั้งค่ามือถือ แล้วลองใหม่' : 'หาตำแหน่งไม่ได้ ลองออกไปที่โล่งแล้วกดลองใหม่')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

function photoBox(id, label) {
  return `<label class="photo" id="${id}Box">${ICON.cam}<span>${esc(label)}</span><input type="file" accept="image/*" id="${id}" aria-label="${esc(label)}"></label>`;
}
function bindPhoto(id, onData, capture) {
  const inp = $(id);
  if (capture) inp.setAttribute('capture', capture);
  inp.onchange = async () => {
    if (!inp.files || !inp.files[0]) return;
    try {
      const data = await fileToJpeg(inp.files[0]);
      $(id + 'Box').innerHTML = `<img src="${data}" alt="รูปที่เลือก"><input type="file" accept="image/*" id="${id}" aria-label="ถ่ายใหม่">`;
      bindPhoto(id, onData, capture);
      onData(data);
    } catch (e) { toast(e.message, true); }
  };
}

/* ---------------- layout ---------------- */
function isAdmin() { return S.me && S.me.staff && S.me.staff.role === 'admin'; }
function setHeader(title, admin) {
  $('hdr').className = admin ? 'admin' : '';
  $('hdr').querySelector('h1').textContent = title;
  $('who').textContent = S.me && S.me.staff ? S.me.staff.nickname + (admin ? ' · หัวหน้า' : '') : '';
}
function setNav(active) {
  const nav = $('nav');
  if (!S.me || !S.me.registered) { nav.style.display = 'none'; return; }
  const items = isAdmin()
    ? [['#a-jobs', 'งานทั้งหมด', ICON.list], ['#a-edit/new', 'เพิ่มงาน', ICON.plus], ['#a-round', 'รอบเบิก', ICON.money], ['#jobs', 'งานของฉัน', ICON.jobs]]
    : [['#jobs', 'งานของฉัน', ICON.jobs], ['#summary', 'ยอดรอบเบิก', ICON.money], ['#profile', 'ข้อมูลของฉัน', ICON.user]];
  nav.innerHTML = items.map(([h, t, ic]) => `<a href="${h}" class="${active === h ? 'on' : ''}">${ic}<span>${t}</span></a>`).join('');
  nav.style.display = 'flex';
}
function showError(e) { app.innerHTML = `<div class="err">${esc(e.message || e)}</div><button class="btn ghost" onclick="render()">ลองใหม่</button>`; }

/* ---------------- router ---------------- */
async function render() {
  window.scrollTo(0, 0);
  if (!S.me.registered) return viewRegister(false);
  if (!S.me.staff.active) { setNav(''); app.innerHTML = '<div class="err">บัญชีของคุณถูกปิดใช้งาน กรุณาติดต่อหัวหน้า</div>'; return; }
  const h = location.hash || (isAdmin() ? '#a-jobs' : '#jobs');
  const [route, a, b] = h.slice(1).split('/');
  try {
    if (route === 'jobs') return await viewJobs();
    if (route === 'checkin') return await viewCheck('in', a);
    if (route === 'checkout') return await viewCheck('out', a);
    if (route === 'summary') return await viewSummary();
    if (route === 'profile') return viewRegister(true);
    if (isAdmin()) {
      if (route === 'a-jobs') return await viewAdminJobs();
      if (route === 'a-edit') return await viewAdminEdit(a);
      if (route === 'a-round') return b ? await viewAdminStaff(a, b) : await viewAdminRound(a);
    }
    location.hash = isAdmin() ? '#a-jobs' : '#jobs';
  } catch (e) { showError(e); }
}
window.addEventListener('hashchange', render);

/* ---------------- ทีมงาน: ลงทะเบียน ---------------- */
function viewRegister(edit) {
  setHeader(edit ? 'ข้อมูลของฉัน' : 'ลงทะเบียนทีมงาน', false);
  setNav(edit ? '#profile' : '');
  const st = (edit && S.me.staff) || {};
  const photos = {};
  app.innerHTML = `
    <p class="sub" style="margin-top:0">${edit ? 'แก้ไขข้อมูลสำหรับทำใบเบิก' : 'กรอกครั้งเดียว ใช้ทำใบเบิกค่าจ้าง'} ข้อมูลนี้เห็นเฉพาะหัวหน้าและฝ่ายบัญชี</p>
    <form id="f">
      <div class="grid2">
        <label class="f">ชื่อเล่น<input name="nickname" value="${esc(st.nickname)}" required></label>
        <label class="f">เบอร์โทร<input name="phone" type="tel" value="${esc(st.phone)}" required></label>
      </div>
      <label class="f">ชื่อ–นามสกุล (ตามบัตรประชาชน)<input name="fullName" value="${esc(st.fullName)}" required></label>
      <label class="f">เลขบัตรประชาชน 13 หลัก<input name="idCard" inputmode="numeric" value="${esc(st.idCard)}" required></label>
      <label class="f">ที่อยู่ตามบัตร<textarea name="address" rows="2" required>${esc(st.address)}</textarea></label>
      <div class="grid2">
        <label class="f">ธนาคาร<select name="bank" required><option value="">เลือกธนาคาร</option>${S.me.banks.map((b) => `<option ${st.bank === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>
        <label class="f">เลขบัญชี<input name="bankAccount" inputmode="numeric" value="${esc(st.bankAccount)}" required></label>
      </div>
      <div class="grid2">
        <div>${photoBox('pIdCard', st.hasIdCardPhoto ? 'มีรูปบัตรแล้ว (แตะเพื่อเปลี่ยน)' : 'รูปบัตรประชาชน')}</div>
        <div>${photoBox('pBank', st.hasBankBookPhoto ? 'มีรูปสมุดแล้ว (แตะเพื่อเปลี่ยน)' : 'รูปหน้าสมุดบัญชี')}</div>
      </div>
      <button class="btn" type="submit">บันทึกข้อมูล</button>
    </form>`;
  bindPhoto('pIdCard', (d) => { photos.idCardPhoto = d; });
  bindPhoto('pBank', (d) => { photos.bankBookPhoto = d; });
  $('f').onsubmit = async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(ev.target).entries());
    if (data.idCard.replace(/\D/g, '').length !== 13) return toast('เลขบัตรประชาชนต้องมี 13 หลัก', true);
    Object.assign(data, photos);
    busy(true);
    try {

    <p class="small">ถ้าอยู่นอกรัศมีหน้างาน ยังกดได้ แต่ระบบจะแจ้งหัวหน้าให้ตรวจ</p>
    <button class="btn ${isIn ? '' : 'dark'}" id="go" disabled>${isIn ? 'ยืนยันเช็คอิน' : 'ยืนยันเช็คเอาท์'}</button>
    <a class="btn ghost" href="#jobs">ยกเลิก</a>`;
  const update = () => { $('go').disabled = !(st.gps && (!needPhoto || st.photo)); };
  if (needPhoto) bindPhoto('selfie', (d) => { st.photo = d; update(); }, 'user');
  const findGps = async () => {
    $('gpsRetry').style.display = 'none';
    $('gpsBox').className = 'status n'; $('gpsBox').innerHTML = '<div><b>กำลังหาตำแหน่ง…</b>กรุณารอสักครู่</div>';
    try {
      st.gps = await getGPS();
      if (j.lat && j.lng) {
        const d = dist(Number(j.lat), Number(j.lng), st.gps.lat, st.gps.lng);
        const ok = d <= S.me.geofence;
        $('gpsBox').className = 'status ' + (ok ? 'ok' : 'w');
        $('gpsBox').innerHTML = `<div><b>${ok ? 'อยู่ในพื้นที่งาน' : 'อยู่นอกรัศมีหน้างาน'}</b>ห่างจุดหน้างาน ${fmtDist(d)} (รัศมี ${int(S.me.geofence)} ม.) · ความแม่นยำ GPS ±${int(st.gps.acc)} ม.</div>`;
      } else {
        $('gpsBox').className = 'status ok';
        $('gpsBox').innerHTML = `<div><b>ได้ตำแหน่งแล้ว</b>ความแม่นยำ GPS ±${int(st.gps.acc)} ม.</div>`;

      st.gps = null;
      $('gpsBox').className = 'status w'; $('gpsBox').innerHTML = `<div><b>หาตำแหน่งไม่ได้</b>${esc(e.message)}</div>`;
      $('gpsRetry').style.display = 'flex';
    }
    update();
  };
  $('gpsRetry').onclick = findGps;
  findGps();
  $('go').onclick = async () => {
    busy(true);
    try {
      const r = await api(isIn ? 'checkIn' : 'checkOut', { assignId, lat: st.gps.lat, lng: st.gps.lng, acc: st.gps.acc, photo: st.photo });

      location.hash = '#jobs';
    } catch (e) { busy(false); toast(e.message, true); }
  };
}

/* ---------------- หัวหน้า: เพิ่ม / แก้งาน ---------------- */
function canonTasks(arr) {
  const order = S.admin.tasks;
  return [...new Set(arr)].sort((a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b))).join(' + ');
}
function defaultRate(tasksStr) {
  const m = S.admin.rates;
  if (m[tasksStr] !== undefined) return m[tasksStr];
  let best = 0;
  tasksStr.split(' + ').forEach((t) => { if (m[t] !== undefined) best = Math.max(best, m[t]); });
  return best;
}
function parseLatLng(text) {
  const t = String(text || '');
  const m = t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  return m ? { lat: Number(m[1]), lng: Number(m[2]) } : null;
}

      <p class="small" id="staffInfo"></p>

  setTimeout(() => map && map.invalidateSize(), 200);
  $('useHere').onclick = async () => { try { busy(true, 'กำลังหาตำแหน่ง…'); const p = await getGPS(); st.lat = p.lat; st.lng = p.lng; setPin(); } catch (e) { toast(e.message, true); } finally { busy(false); } };
  $('clearPin').onclick = () => { st.lat = null; st.lng = null; setPin(); };
  $('paste').onchange = () => {
    const ll = parseLatLng($('paste').value);
    if (ll) { st.lat = ll.lat; st.lng = ll.lng; setPin(); }
    else toast('อ่านพิกัดไม่ได้ ลิงก์ย่อ (maps.app.goo.gl) ใช้ไม่ได้ ให้กดค้างที่จุดใน Google Maps แล้วคัดลอกตัวเลขพิกัดมาวาง', true);
  };

  refreshRate(); refreshStaff();

  f.onsubmit = async (ev) => {
    ev.preventDefault();
    if (!st.tasks.length) return toast('กรุณาเลือกหน้าที่', true);
    if (!st.staff.length) return toast('กรุณาเลือกทีมงาน', true);
    const payload = {
      groupId: isNew ? '' : groupId, event: F['event'].value, date: F['date'].value, start: F['start'].value, end: F['end'].value,
      locName: F['locName'].value, lat: st.lat, lng: st.lng, tasks: st.tasks, staffIds: st.staff, amount: $('amount').value
    };
    busy(true);
    try {
      await api('saveGroup', payload);
      busy(false); toast(isNew ? 'บันทึกแล้ว ระบบจะแจ้งทีมงานทาง LINE' : 'บันทึกการแก้ไขแล้ว');
      S.admin = null; S.adminFrom = payload.date;
      location.hash = '#a-jobs';
    } catch (e) { busy(false); toast(e.message, true); }
  };
  if ($('del')) $('del').onclick = async () => {
    if (!(await confirmBox('ลบงานนี้?', `${g.event}\n${g.dateTh} ${g.start}\nระบบจะแจ้งทีมงานว่างานถูกยกเลิก`, 'ลบงาน', true))) return;
    busy(true);
    try { await api('deleteGroup', { groupId }); busy(false); toast('ลบงานแล้ว'); location.hash = '#a-jobs'; }
    catch (e) { busy(false); toast(e.message, true); }
  };
}

/* ---------------- หัวหน้า: รอบเบิก ---------------- */
async function viewAdminRound(roundId) {
  setHeader('รอบเบิก', true); setNav('#a-round');
  app.innerHTML = '<div class="loading">กำลังสรุปยอด…</div>';
  const r = await api('roundOverview', { roundId: roundId || '' });
  let html = `<label class="f">เลือกรอบ<select id="rsel">${r.rounds.map((x) => `<option value="${esc(x.roundId)}" ${x.roundId === r.roundId ? 'selected' : ''}>${esc(x.label)}${x.approved ? ' (อนุมัติแล้ว)' : ''}</option>`).join('')}</select></label>`;
  html += `<div class="card"><div class="row"><span class="sub">ยอดรวมหลังหักมาสาย ก่อนหักภาษี</span><b style="font-size:20px">${money(r.totalGross)}</b></div>
    <div class="small" style="margin-top:4px">${r.staff.length} คน · ${r.approved ? 'อนุมัติแล้ว' : r.ended ? 'รอบสิ้นสุดแล้ว รออนุมัติ' : 'รอบยังไม่สิ้นสุด'}</div></div>`;
  if (!r.approved && r.pendingTotal) html += `<div class="status w"><div><b>รอตรวจ ${r.pendingTotal} งาน</b>แตะชื่อทีมงานที่มีป้ายสีส้มเพื่อตรวจก่อนอนุมัติ</div></div>`;
  html += '<div class="card" style="padding:4px 16px">' + (r.staff.length ? r.staff.map((x) => `
    <a href="#a-round/${esc(r.roundId)}/${esc(x.staffId)}" class="member" style="color:inherit;text-decoration:none;padding:12px 0">
      <span><b>${esc(x.nickname)}</b><div class="small">${x.count} งาน${x.voucherNo ? ' · ' + esc(x.voucherNo) : ''}${r.approved ? (x.ackAt ? ' · รับทราบ ' + esc(x.ackAt) : ' · ยังไม่รับทราบ') : ''}</div></span>
      <span style="text-align:right"><b>${money(r.approved && x.net !== '' ? x.net : x.gross)}</b>${x.pending ? `<div><span class="chip w">รอตรวจ ${x.pending}</span></div>` : ''}${r.approved ? '<div class="small">สุทธิ</div>' : ''}</span>
    </a>`).join('') : '<div class="empty">ไม่มีงานในรอบนี้</div>') + '</div>';
  if (!r.approved && r.staff.length) {
    html += `<button class="btn" id="approve" ${r.pendingTotal ? 'disabled' : ''}>อนุมัติทั้งรอบ และส่งบัญชี</button>`;
    if (!r.ended) html += '<p class="small">รอบนี้ยังไม่ถึงวันสุดท้าย งานที่ยังไม่ถึงวันจะนับเป็นรอตรวจ</p>';
  }
  if (r.approved) {
    html += '<h2>ใบเบิก (PDF)</h2><div class="card" style="padding:4px 16px">' + r.staff.filter((x) => x.pdfUrl).map((x) =>
      `<div class="member" style="padding:10px 0"><span>${esc(x.voucherNo)} · ${esc(x.nickname)}</span><a class="link" href="#" data-pdf="${esc(x.pdfUrl)}">เปิด PDF</a></div>`).join('') + '</div>';
    html += '<button class="btn ghost" id="regen">สร้างใบเบิกใหม่ทั้งรอบ</button><p class="small">ใช้เมื่อแก้ข้อมูลบริษัทหรือข้อมูลทีมงานในชีต แล้วอยากให้ใบเบิกอัปเดต</p>';
  }
  app.innerHTML = html;
  $('rsel').onchange = (e) => { location.hash = '#a-round/' + e.target.value; };
  app.querySelectorAll('[data-pdf]').forEach((a) => { a.onclick = (e) => { e.preventDefault(); openExternal(a.dataset.pdf); }; });
  if ($('approve')) $('approve').onclick = async () => {
    const ok = await confirmBox('อนุมัติรอบ ' + r.label + '?',
      `${r.staff.length} คน · ยอดรวมก่อนหักภาษี ${money(r.totalGross)} บาท\nหลังอนุมัติจะแก้ยอดไม่ได้ ระบบจะสร้างใบเบิก ส่งให้บัญชี และแจ้งทีมงานให้ดูยอดทาง LINE`, 'อนุมัติ');
    if (!ok) return;
    busy(true, 'กำลังสร้างใบเบิก อาจใช้เวลา 1–2 นาที…');
    try {
      const res = await api('approveRound', { roundId: r.roundId });
      busy(false);
      toast(`อนุมัติแล้ว ${res.count} ใบ${res.failed && res.failed.length ? ' (สร้างไม่สำเร็จ: ' + res.failed.join(', ') + ')' : ''}`, res.failed && res.failed.length);
      viewAdminRound(r.roundId);
    } catch (e) { busy(false); toast(e.message, true); }
  };
  if ($('regen')) $('regen').onclick = async () => {
    busy(true, 'กำลังสร้างใบเบิกใหม่…');
    try { const res = await api('regenerateVoucher', { roundId: r.roundId }); busy(false); toast('สร้างใหม่แล้ว ' + res.count + ' ใบ'); viewAdminRound(r.roundId); }
    catch (e) { busy(false); toast(e.message, true); }
  };
}

function itemCard(it) {
  const showRes = it.amount !== it.defaultAmount;
  return `<div class="card ${it.pending && !it.future ? 'warn' : ''}" id="c_${esc(it.assignId)}">
    <div class="row"><b>${esc(it.dateTh)}</b><span class="small">${esc(it.start)}${it.end ? '–' + esc(it.end) : ''}</span></div>
    <div class="title">${esc(it.event)}</div>
    <div class="sub">${esc(it.tasks)}</div>
    <div class="small" style="margin-top:6px">เข้า ${esc(it.checkIn || '-')}${it.inDist !== '' ? ' (ห่าง ' + fmtDist(it.inDist) + ')' : ''} · ออก ${esc(it.checkOut || '-')}${it.outDist !== '' ? ' (ห่าง ' + fmtDist(it.outDist) + ')' : ''}</div>
    ${it.flags.length ? `<div style="margin-top:6px">${it.flags.map((f) => `<span class="chip w">${esc(f)}</span> `).join('')}${it.reviewed ? '<span class="chip lg">ตรวจแล้ว</span>' : ''}</div>` : ''}
    ${it.lateMin > 0 ? `<div style="margin-top:6px"><span class="chip w">สาย ${int(it.lateMin)} นาที (หลังผ่อนผัน)${it.lateWaived ? ' · ยกเว้นแล้ว' : ' · หัก ' + int(it.lateDeduct) + ' บาท'}</span></div>` : ''}
    ${it.adminNote ? `<div class="small" style="margin-top:4px">บันทึก: ${esc(it.adminNote)}</div>` : ''}
    <div class="pills" style="margin-top:8px">
      ${it.hasInPhoto ? `<button type="button" class="pill" data-ph="in">รูปตอนเข้า</button>` : ''}
      ${it.hasOutPhoto ? `<button type="button" class="pill" data-ph="out">รูปตอนออก</button>` : ''}
    </div>
    <div class="phview"></div>
    ${it.approvedLock ? `<div class="sum big"><span>ยอดจ่าย${it.lateDeduct > 0 ? ' (หักมาสายแล้ว)' : ''}</span><span>${money(it.amount - it.lateDeduct)}</span></div>` : `
    <div class="hr"></div>
    <div class="grid2">
      <label class="f">ยอดจ่าย (บาท)<input class="amt" inputmode="numeric" value="${esc(it.amount)}"></label>
      <div class="small" style="align-self:center">ตั้งต้น ${int(it.defaultAmount)} บาท<br>ใส่ 0 = ไม่จ่ายงานนี้</div>
    </div>
    <label class="f rs" style="${showRes ? '' : 'display:none'}">เหตุผลที่ปรับยอด (ภายใน ทีมงานไม่เห็น)<input class="reason" value="${esc(it.reason)}" placeholder="เช่น ออนคนเดียว / งานยาว 16 ชม."></label>
    ${!it.checkIn && !it.future ? '<label class="f">ใส่เวลาเข้าแทน (ถ้ามาทำงานจริง)<input type="time" class="tin"></label>' : ''}
    ${(it.checkIn && !it.checkOut) && !it.future ? '<label class="f">ใส่เวลาออกแทน<input type="time" class="tout"></label>' : ''}
    ${it.flags.length && !it.future ? `<label style="display:flex;gap:10px;align-items:center;font-size:15px;margin-bottom:8px"><input type="checkbox" class="rev" style="width:22px;height:22px" ${it.reviewed ? 'checked' : ''}> ตรวจแล้ว</label>` : ''}
    ${it.lateMin > 0 ? `<label style="display:flex;gap:10px;align-items:center;font-size:15px;margin-bottom:8px"><input type="checkbox" class="waive" style="width:22px;height:22px" ${it.lateWaived ? 'checked' : ''}> ยกเว้นหักมาสายงานนี้</label>` : ''}
    <button class="btn sm save" type="button" style="width:100%">บันทึก</button>`}
  </div>`;
}

async function viewAdminStaff(roundId, staffId) {
  setHeader('ตรวจงานรายคน', true); setNav('#a-round');
  app.innerHTML = '<div class="loading">กำลังโหลด…</div>';
  const d = await api('roundDetail', { roundId, staffId });
  d.items.forEach((it) => { it.approvedLock = d.approved; });
  const total = () => d.items.reduce((a, b) => a + Number(b.amount) - Number(b.lateDeduct || 0), 0);
  app.innerHTML = `<div class="row" style="margin-bottom:10px"><b style="font-size:18px">${esc(d.nickname)}</b><span>รวม (หักมาสายแล้ว) <b id="tot">${money(total())}</b></span></div>
    <div id="items">${d.items.map(itemCard).join('')}</div>
    <a class="btn ghost" href="#a-round/${esc(roundId)}">กลับไปหน้ารอบเบิก</a>`;
  d.items.forEach((it) => bindItem(it, d, total));
}

function bindItem(it, d, total) {
  const c = $('c_' + it.assignId);
  c.querySelectorAll('[data-ph]').forEach((b) => {
    b.onclick = async () => {
      const v = c.querySelector('.phview');
      v.innerHTML = '<div class="small">กำลังโหลดรูป…</div>';
      try { const r = await api('photo', { assignId: it.assignId, kind: b.dataset.ph }); v.innerHTML = `<img class="imgview" src="${r.dataUrl}" alt="รูป${b.dataset.ph === 'in' ? 'ตอนเข้า' : 'ตอนออก'}">`; }
      catch (e) { v.innerHTML = `<div class="small">${esc(e.message)}</div>`; }
    };
  });
  if (it.approvedLock) return;
  const amt = c.querySelector('.amt');
  amt.oninput = () => { c.querySelector('.rs').style.display = Number(amt.value) !== it.defaultAmount ? '' : 'none'; };
  c.querySelector('.save').onclick = async () => {
    const p = { assignId: it.assignId, amount: amt.value, reason: c.querySelector('.reason').value };
    const tin = c.querySelector('.tin'); if (tin && tin.value) p.checkInTime = tin.value;
    const tout = c.querySelector('.tout'); if (tout && tout.value) p.checkOutTime = tout.value;
    const rev = c.querySelector('.rev'); if (rev) p.reviewed = rev.checked;
    const waive = c.querySelector('.waive'); if (waive) p.lateWaived = waive.checked;
    busy(true);
    try {
      const n = await api('updateAssignment', p);
      busy(false); toast('บันทึกแล้ว');
      n.approvedLock = false;
      const idx = d.items.findIndex((x) => x.assignId === it.assignId);
      d.items[idx] = n;
      c.outerHTML = itemCard(n);
      bindItem(n, d, total);
      $('tot').textContent = money(total());
    } catch (e) { busy(false); toast(e.message, true); }
  };
}

/* ---------------- start ---------------- */
(async function start() {
  if (CONFIG.LIFF_ID.indexOf('ใส่_') === 0 || CONFIG.API_URL.indexOf('ใส่_') === 0) {
    app.innerHTML = '<div class="err">ยังไม่ได้ตั้งค่า LIFF_ID และ API_URL ในไฟล์ index.html</div>';
    return;
  }
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const view = new URLSearchParams(location.search).get('view');
    if (view && !location.hash) location.hash = '#' + view;
    S.me = await api('me');
    render();
  } catch (e) { showError(e); }
})();
</script>
